# Tokyo Night colours from https://github.com/folke/tokyonight.nvim
# (lua/tokyonight/colors/*.lua and extras/lua/tokyonight_day.lua).
# Each theme uses its own style in dark mode and the "day" style in light
# mode, as tokyonight.nvim does.
#
# Mapping from palette name to theme variable:
#   page = bg, cards = bg_highlight, header and sidebar = bg_dark,
#   main colour = blue, accent = magenta, text = fg / fg_dark / comment.
Tokyo Night:
  modes:
    dark:
      primary-color: "#7aa2f7"
      rgb-primary-color: "122, 162, 247"
      accent-color: "#bb9af7"
      rgb-accent-color: "187, 154, 247"
      text-primary-color: "#16161e"
