# Tokyo Night, originally a Visual Studio Code theme by Enkia
# (https://github.com/tokyo-night/tokyo-night-vscode-theme, MIT License).
# Colour values from the tokyonight.nvim palette by Folke Lemaitre
# (https://github.com/folke/tokyonight.nvim, Apache License 2.0):
# lua/tokyonight/colors/*.lua and extras/lua/tokyonight_day.lua.
# Each theme uses its own style in dark mode and the "day" style in light
# mode, as tokyonight.nvim does.
#
# Mapping from palette name to theme variable:
#   page = bg, cards = bg_highlight, header and sidebar = bg_dark,
#   main colour = blue, accent = magenta, text = fg / fg_dark / comment.
# Home Assistant's own colour scales (ha-color-primary-*, ha-color-neutral-*)
# are set as well, so buttons, links and form fields use these colours and
# not the built-in cyan and grey.
# Some values are lighter or darker versions of palette colours, so that text
# reaches a contrast of 4.5:1 and icons 3:1. Day uses bg for the page and a
# lighter tint of bg for cards, because its text is too light on bg_dark.
Tokyo Night:
  modes:
    dark:
      primary-color: "#7aa2f7"
      rgb-primary-color: "122, 162, 247"
      accent-color: "#bb9af7"
